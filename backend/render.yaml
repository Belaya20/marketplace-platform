# render.yaml
# Render Blueprint — defines the backend service declaratively.
# Commit this file to your repo. Render reads it on first deploy.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: addismarket-api
    runtime: node
    region: oregon          # US West — closest to East Africa via Pacific
    plan: free              # Free tier — upgradeable to $7/mo

    # Build & start
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/server.js

    # Auto-deploy on push to main
    autoDeploy: true

    # Health check — Render uses this to know the service is up
    healthCheckPath: /health

    # Environment variables — set real values in Render dashboard
    # These are the KEYS only. Values go in Render → Environment tab.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false          # set manually in dashboard — never in this file
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@addismarket.et
      - key: API_BASE_URL
        sync: false